# Las actualizaciones de seguridad, sin acordarse.
#
# Una vez por semana, y agrupadas, para que lleguen como una petición que se lee
# y no como veinte que se aprueban sin mirar. Las acciones de CI van fijadas por
# commit (`ci.yml`): Dependabot cambia el commit y el comentario de la versión a
# la vez (docs/adr/0117).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React, ReactDOM y sus tipos, siempre en la misma petición y en cualquier
      # salto de versión. Llegaron separados una vez: `@types/react` subió sin
      # `@types/react-dom` y los tipos dejaron de cuadrar en 138 ficheros. Va el
      # primero porque cada dependencia entra en el primer grupo que la admite.
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      produccion:
        dependency-type: production
        update-types: [patch]

  # La raíz mira los flujos de `.github/workflows`; la acción compuesta vive aparte
  # y, sin nombrarla, sus acciones fijadas no se subirían nunca.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/preparar]
    schedule:
      interval: weekly

  # Las imágenes base del `Dockerfile` y las de `compose.yml`, que van con huella.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
