# La aplicación entera, y la IA de casa si la quieres.
#
# Cinco servicios en dos grupos. El primero es la aplicación —base de datos,
# migraciones y servidor— y se levanta siempre. El segundo es el modelo de casa
# —Ollama y la descarga de sus pesos— y **solo se levanta si lo pides**, porque
# pide una gráfica NVIDIA y esto tiene que seguir funcionando en un portátil que
# no la tenga ([adr/0014](docs/adr/0014-un-modelo-de-casa-para-probar.md),
# [adr/0047](docs/adr/0047-la-ia-es-un-perfil-no-un-fichero.md)).
#
#   docker compose up --build              la aplicación, en http://localhost:3000
#   docker compose --profile ia up --build  además el modelo de casa
#   docker compose up db                   solo Postgres, para usarlo con `pnpm dev`
#   docker compose up ollama               solo el modelo, sin la aplicación
#   docker compose --profile '*' down      parar TODO; con -v además borra los datos
#
# **`docker compose down` a secas no para lo que esté en un perfil.** Deja Ollama
# corriendo —cinco gigas de pesos en la gráfica— y encima falla al borrar la red
# con un «resource is still in use» que no dice quién la usa. Por eso `pnpm
# docker:down` lleva `--profile '*'`, que significa «todos».
#
# Y `pnpm docker:up` / `pnpm docker:ia` hacen lo mismo comprobando antes que
# Docker es el de verdad y escribiendo el `.env` que falte.
#
# Existe para que las cuentas se puedan probar de verdad. Sin base de datos la
# aplicación funciona —anónima, con plan gratis y el avance en el navegador—, y eso
# significa que todo lo que cuelga de una cuenta se escribió sin poder ejecutarlo:
# entrar, registrarse, el plan, la fusión del avance y el cupo de la IA.
#
# Las contraseñas de aquí son para tu portátil. Lo que salga a internet va con
# `POSTGRES_PASSWORD` y `AUTH_SECRET` puestos de verdad, y eso lo explica
# docs/DESPLIEGUE.md.

name: caos-ordenado

services:
  # --------------------------------------------------------------------------
  # La aplicación. Sin perfil, así que es lo que sale con `docker compose up`.
  # --------------------------------------------------------------------------

  db:
    image: postgres:17-alpine
    # Vuelve sola al encender Docker, pero no si la paraste a mano. Es lo que hace
    # que este proyecto esté donde lo dejaste en vez de haber que acordarse.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caos}
      POSTGRES_DB: ${POSTGRES_DB:-caos}
    ports:
      # Abierto al equipo para poder apuntar aquí desde `pnpm dev` y desde
      # `pnpm db:studio` sin entrar en el contenedor.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      # Postgres arranca dos veces al crearse: la primera para inicializar y la
      # segunda ya de verdad. Sin esperar a esto, las migraciones se lanzan contra
      # el arranque intermedio y fallan una vez de cada tres.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-caos} -d ${POSTGRES_DB:-caos}']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # Las migraciones, en su propio contenedor y una sola vez.
  #
  # Aparte y no dentro del arranque de la aplicación a propósito: migrar al
  # levantarse funciona muy bien hasta el día en que se despliegan dos instancias a
  # la vez y las dos migran. Es la misma decisión que ya explica drizzle.config.ts,
  # aquí solo se cumple.
  migraciones:
    build:
      context: .
      target: migraciones
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-caos}:${POSTGRES_PASSWORD:-caos}@db:5432/${POSTGRES_DB:-caos}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: run
    restart: unless-stopped
    environment:
      # Dentro de la red de compose la base de datos se llama `db`. Desde el
      # equipo es `localhost`, y por eso esta cadena se pone aquí y no en `.env`:
      # si estuviera allí, `pnpm dev` intentaría resolver `db` y no podría.
      DATABASE_URL: postgres://${POSTGRES_USER:-caos}:${POSTGRES_PASSWORD:-caos}@db:5432/${POSTGRES_DB:-caos}
      # Sin secreto no hay cuentas, así que aquí no vale un valor por defecto
      # silencioso: `docker compose up` avisa si falta y la aplicación arranca en
      # modo anónimo, que es justo lo que se venía a probar.
      AUTH_SECRET: ${AUTH_SECRET:?falta AUTH_SECRET, ponlo en .env — mira README}
      # La IA es opcional: sin clave, el profesor y las ideas contestan que no hay
      # modelo configurado y todo lo demás funciona igual.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A qué modelo de casa hablarle, si hay alguno.
      #
      # **No sale de `OLLAMA_URL` del `.env`**, y por eso tiene otro nombre: aquella
      # dice `localhost` porque la usa `pnpm dev`, y dentro de un contenedor
      # `localhost` es el propio contenedor.
      #
      # Vale para las dos maneras de tener un Ollama, y por eso es una variable y
      # no una dirección fija:
      #
      #   - El del perfil `ia` de aquí abajo, que se llama `ollama` en esta red.
      #     Lo pone `scripts/docker-arriba.sh --ia`, y a mano son las **dos líneas
      #     juntas** que el `.env` trae comentadas: el perfil y esta dirección.
      #   - Uno que ya corra en tu equipo, fuera de compose. Ahí la dirección es la
      #     IP de la máquina y **cambia al reiniciar**, así que la calcula el
      #     script en lugar de escribirse a mano en un fichero que caduca.
      #
      # **Y por eso `docker compose up` a secas deja la IA apagada**, aunque tengas
      # un Ollama corriendo: esta variable la calcula el script, y no hay ninguna
      # dirección fija que se pueda poner aquí en su lugar. Está medido:
      # `host.docker.internal` apunta a Windows y no a WSL, y la puerta del puente
      # tampoco llega
      # ([adr/0050](docs/adr/0050-la-direccion-del-ollama-del-equipo-la-calcula-el-script.md)).
      #
      # Vacía a propósito si no hay ninguno: la aplicación dice que no hay modelo
      # configurado y **no gasta cupo**. Apuntando a un Ollama que no contesta sí
      # lo gastaría, que es la razón de que esto no traiga una dirección por
      # defecto (`docs/AI.md`).
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # El servidor standalone de Next escucha en la interfaz que se le diga; sin
      # esto se queda en el bucle local del contenedor y desde fuera no contesta.
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports:
      # El puerto de dentro siempre es el 3000; el de fuera se puede mover con
      # `APP_PORT` en `.env`. Hace falta poder moverlo porque el 3000 es el puerto
      # por defecto de medio mundo, y si otro contenedor tuyo ya lo tiene, esto no
      # arranca con un error que habla de «endpoint» y no de quién lo ocupa.
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
      # **`required: false` es lo que hace que los dos grupos sean separables.**
      # Con el perfil `ia` puesto, la aplicación espera a que el modelo esté
      # descargado antes de aceptar peticiones —si no, la primera pregunta
      # contesta un 502 mientras bajan cinco gigas, y eso no se parece en nada a
      # «está descargando»—. Sin el perfil, esta línea no existe: no arrastra el
      # servicio ni impide arrancar.
      ia-modelo:
        condition: service_completed_successfully
        required: false

  # --------------------------------------------------------------------------
  # El modelo de casa. Solo con `--profile ia`, o nombrándolo.
  #
  # Lo que se levanta aquí no sabe nada de la aplicación: es un servidor de modelos
  # genérico al que se le habla por HTTP desde `src/server/local-model.ts`.
  #
  # **Con `ANTHROPIC_API_KEY` puesta, esto no se usa.** La clave gana al modelo
  # local a propósito, y el porqué está en `src/server/ai-model.ts`: una variable de
  # probar que se queda puesta no puede degradar en silencio lo que se sirve.
  # --------------------------------------------------------------------------

  ollama:
    profiles: ['ia']
    # Sin versión fija a propósito: es una herramienta de desarrollo, no algo que
    # se despliegue, y los modelos nuevos piden Ollama nuevo.
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # **El modelo se queda cargado mientras el contenedor viva.**
      #
      # De serie Ollama lo descarga a los cinco minutos sin uso, y volver a
      # cargarlo cuesta lo que cueste leer cinco gigas: 2,7 s si el fichero sigue
      # en la caché del sistema y **86 s si no**. Con quince gigas de RAM y ocho en
      # caché, ese fichero compite con todo lo demás, así que la espera larga
      # vuelve cuando menos se espera —y es justo la queja que trajo esto aquí—.
      #
      # Cuesta 5,6 GB de gráfica retenidos. Con una de 12 sobra; con una más
      # pequeña, pon aquí `5m` y recupera el comportamiento de antes.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      # Los pesos, fuera del contenedor. Son cinco gigas por modelo: volver a
      # descargarlos en cada `up` sería inaceptable, y es lo que pasa sin esto.
      - modelos:/root/.ollama
    ports:
      # Abierto al equipo para poder apuntar aquí desde `pnpm dev` con
      # OLLAMA_URL=http://localhost:11434, igual que se hace con Postgres.
      - '${OLLAMA_PORT:-11434}:11434'
    healthcheck:
      # Que el proceso esté arrancado no significa que conteste: `ollama list`
      # habla con la API por dentro, que es justo lo que va a hacer la aplicación.
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            # Sin gráfica NVIDIA, comenta estas cuatro líneas: funciona igual en la
            # CPU, pero una respuesta pasa de tres segundos a un minuto largo y
            # deja de servir para probar nada con la guitarra en las manos.
            #
            # Que esto viva en un perfil es justo lo que permite que siga aquí: sin
            # `--profile ia` este servicio no se levanta, así que un equipo sin
            # gráfica hace `docker compose up` y no se entera de que existe.
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # La descarga del modelo, en su propio contenedor y una sola vez.
  #
  # Misma decisión que las migraciones: una tarea que termina no vive dentro del
  # arranque de otro servicio.
  ia-modelo:
    profiles: ['ia']
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/ollama']
    command: ['pull', '${OLLAMA_MODEL:-qwen3:8b}']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

volumes:
  datos:
  modelos:
